name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          test -d tests || { echo "ERROR: tests/ directory is required"; exit 1; }
          python -m pytest tests/ -v --tb=short

      - name: Code Quality Checks
        run: |
          python -m pip install flake8 black
          python -m compileall -q packages tests
          python -m flake8 packages tests --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m black --check packages tests
